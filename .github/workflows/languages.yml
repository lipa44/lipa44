name: Languages Metrics

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/languages.yml
      - .github/scripts/**

  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: languages-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lowlighter/metrics
          ref: 65836723097537a54cd8eb90f61839426b4266b6
          path: .metrics-action
          persist-credentials: false
      - name: Restore recent-language support for current GitHub events
        run: node .github/scripts/patch-metrics.mjs .metrics-action
      - name: Test recent-language analysis
        run: node --test .github/scripts/test-push-commits.mjs
        env:
          METRICS_ACTION_PATH: .metrics-action
      - uses: ./.metrics-action
        with:
          use_prebuilt_image: no
          plugins_errors_fatal: yes
          committer_branch: ${{ github.ref_name }}
          token: ${{ secrets.METRICS_TOKEN_WITH_SCOPES }}
          filename: .github/metrics/languages_metrics.svg
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: >-
            dockerfile, makefile, cmake
          plugin_languages_sections: recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 4
          plugin_languages_recent_load: 400
          plugin_languages_recent_days: 14
          commits_authoring: Mikhail Libchenko, Libchenko Mikhail, lipa44, libchenkomikhail@gmail.com
